[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-aggregator"
version = "1.0.0"
description = "Proportional aggregation of benign domain lists into a single CSV"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache License 2.0" }
authors = [{ name = "Victor Carneiro", email = "victor.carneiro@udc.es" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
domain-aggregator = "domain_aggregator.cli:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
